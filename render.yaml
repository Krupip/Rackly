services:
  - type: web
    name: rackly
    runtime: docker
    rootDir: Rackly
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: Rackly
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: rackly
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: MIDTRANS_IS_SANITIZED
        value: "true"
      - key: MIDTRANS_IS_3DS
        value: "true"

